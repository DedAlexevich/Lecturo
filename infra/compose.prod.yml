services:
  db:
    ports: !reset []
    restart: always

  db-backup:
    profiles: ["local"]

  redis:
    ports: !reset []
    restart: always

  bot-redis:
    restart: always

  api:
    restart: always

  worker:
    restart: always

  tusd:
    restart: always

  bot:
    extra_hosts:
      - "api.telegram.org:${TELEGRAM_API_IP:-149.154.167.220}"
    restart: always

  frontend:
    restart: always

  caddy:
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: always
