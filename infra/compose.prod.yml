x-smtp: &smtp
  SMTP_HOST: ${SMTP_HOST:-mail}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_FROM: "${SMTP_FROM:-Lecturo <noreply@${MAIL_DOMAIN:-${SITE_ADDRESS}}>}"

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
    ports: !reset []
    restart: always

  db-backup:
    profiles: ["local"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}

  redis:
    ports: !reset []
    restart: always

  bot-redis:
    restart: always

  api:
    environment:
      <<: *smtp
      DATABASE_URL: postgresql+asyncpg://lecturo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}@db:5432/lecturo
    networks:
      - default
      - mail
    restart: always

  mail:
    build: ./infra/mail
    security_opt:
      - no-new-privileges:true
    networks:
      - mail
    entrypoint: ["/bin/sh", "/log-to-file.sh", "/var/log/lecturo/mail.log", "entrypoint.sh"]
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-${SITE_ADDRESS}}
      DKIM_SELECTOR: ${DKIM_SELECTOR:-mail}
      LOG_MAX_MB: ${LOG_MAX_MB:-10}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
      LOG_FILE_MODE: "640"
    volumes:
      - ${DATA_DIR:-./data}/mail/dkim:/etc/opendkim/keys
      - ${DATA_DIR:-./data}/logs:/var/log/lecturo
      - ./infra/log-to-file.sh:/log-to-file.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "postfix status && nc -z 127.0.0.1 8891"]
      interval: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  worker:
    environment:
      <<: *smtp
      DATABASE_URL: postgresql+asyncpg://lecturo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}@db:5432/lecturo
    networks:
      - default
      - mail
    restart: always
    stop_grace_period: 60s

  tusd:
    restart: always

  bot:
    environment:
      DATABASE_URL: postgresql://lecturo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}@db:5432/lecturo
    extra_hosts:
      - "api.telegram.org:${TELEGRAM_API_IP:-149.154.167.220}"
    restart: always

  frontend:
    restart: always

  caddy:
    environment:
      WWW_SITE_ADDRESS: www.${SITE_ADDRESS}
      API_DOCS: "off"
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: always

networks:
  mail:
