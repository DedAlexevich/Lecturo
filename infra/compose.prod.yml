services:
  db:
    ports: !reset []
    restart: always

  redis:
    ports: !reset []
    restart: always

  bot-redis:
    restart: always

  api:
    restart: always

  worker:
    restart: always

  tusd:
    restart: always

  bot:
    restart: always

  frontend:
    restart: always

  caddy:
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: always
