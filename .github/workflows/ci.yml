name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lecturo
          POSTGRES_PASSWORD: lecturo
          POSTGRES_DB: lecturo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lecturo"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://lecturo:lecturo@localhost:5432/lecturo
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-inter fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python ../scripts/check_comments.py . ../scripts
      - run: test "$(alembic heads | wc -l)" -eq 1
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest
      - name: openapi.json up to date
        run: |
          python -m app.openapi openapi.json
          git diff --exit-code openapi.json

  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python ../scripts/check_comments.py . ../scripts
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:comments
      - name: API types up to date
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 180 db redis api worker bot frontend tusd caddy
      - run: curl -fsS http://localhost/api/v1/health
      - run: curl -fsS http://localhost/ | grep -q Lecturo
      - name: Hooks endpoint closed from outside
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/api/v1/uploads/hooks)" = 404
      - name: tusd reaches hooks inside compose
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Tus-Resumable: 1.0.0' -H 'Upload-Length: 10' http://localhost/files/)" = 401
      - run: test "$(docker compose ps worker --format '{{.State}}')" = running
      - run: test "$(docker compose ps bot --format '{{.State}}')" = running
      - if: failure()
        run: docker compose logs
