name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lecturo
          POSTGRES_PASSWORD: lecturo
          POSTGRES_DB: lecturo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lecturo"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://lecturo:lecturo@localhost:5432/lecturo
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-ffmpeg-pango-v1
      - name: System packages
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" ffmpeg libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-inter fonts-dejavu-core postgresql-common
          sudo chown -R "$USER" ~/apt-archives
      - run: sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y && sudo apt-get install -y --no-install-recommends postgresql-client-16
      - run: echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python ../scripts/check_comments.py . ../scripts
      - run: test "$(alembic heads | wc -l)" -eq 1
      - run: alembic upgrade head
      - name: Migrations downgrade
        run: alembic downgrade base && alembic upgrade head
      - run: alembic check
      - run: pytest
      - name: openapi.json up to date
        run: |
          python -m app.openapi openapi.json
          git diff --exit-code openapi.json

  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lecturo
          POSTGRES_PASSWORD: lecturo
          POSTGRES_DB: lecturo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lecturo"
          --health-interval 5s
          --health-retries 10
    env:
      BOT_SCHEMA_CHECK: "1"
      PGHOST: localhost
      PGUSER: lecturo
      PGPASSWORD: lecturo
      PGDATABASE: lecturo
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bot/pyproject.toml
            backend/pyproject.toml
      - name: Apply backend migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://lecturo@localhost:5432/lecturo
        run: |
          python -m venv "$RUNNER_TEMP/backend"
          "$RUNNER_TEMP/backend/bin/pip" install -e .
          "$RUNNER_TEMP/backend/bin/alembic" upgrade head
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python ../scripts/check_comments.py . ../scripts
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:comments
      - run: npm run test:local
      - name: API types up to date
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run build
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Telegram Mini App tests
        env:
          VITE_TELEGRAM_BOT_USERNAME: lecturo_test_bot
        run: |
          npx vite --host 127.0.0.1 --port 5186 --strictPort &
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:5186/ >/dev/null; do sleep 1; done'
          npm run test:telegram

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck --version
      - run: shellcheck -x -S warning infra/*.sh infra/backup/*.sh infra/mail/*.sh scripts/*.sh

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: lecturo
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - name: Prod compose config
        env:
          SITE_ADDRESS: lecturo.test
        run: docker compose -f docker-compose.yml -f infra/compose.prod.yml config -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: lecturo-api,lecturo-worker,lecturo-migrate
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: bot
          load: true
          tags: lecturo-bot
          cache-from: type=gha,scope=bot
          cache-to: type=gha,scope=bot,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          build-args: VITE_TELEGRAM_BOT_USERNAME=
          tags: lecturo-frontend
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: infra/mail
          load: true
          tags: lecturo-mail
          cache-from: type=gha,scope=mail
          cache-to: type=gha,scope=mail,mode=max
      - name: Mail image starts
        env:
          SITE_ADDRESS: lecturo.test
        run: |
          docker compose -f docker-compose.yml -f infra/compose.prod.yml up -d --no-deps --wait --wait-timeout 120 mail
          docker compose -f docker-compose.yml -f infra/compose.prod.yml rm -sf mail
      - run: docker compose up -d --wait --wait-timeout 180 db redis api worker bot frontend tusd caddy db-backup
      - run: curl -fsS http://localhost/api/v1/health
      - run: curl -fsS http://localhost/ | grep -q Lecturo
      - name: Hooks endpoint closed from outside
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/api/v1/uploads/hooks)" = 404
      - name: tusd reaches hooks inside compose
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Tus-Resumable: 1.0.0' -H 'Upload-Length: 10' http://localhost/files/)" = 401
      - run: test "$(docker compose ps worker --format '{{.State}}')" = running
      - run: test "$(docker compose ps bot --format '{{.State}}')" = running
      - name: Scheduled backup exists and local scripts work
        run: |
          timeout 60 sh -c 'until ls data/backups/lecturo-*.dump; do sleep 1; done'
          scripts/backup-db.sh
          echo yes | scripts/restore-db.sh "$(ls data/backups/lecturo-*.dump | tail -n 1)"
          curl -fsS http://localhost/api/v1/health
      - name: Backup, check and restore database
        run: |
          infra/backup/backup.sh
          infra/backup/check.sh
          echo yes | infra/backup/restore.sh "$(ls backups/lecturo-*.dump)"
          curl -fsS http://localhost/api/v1/health
      - name: Encrypted backup, upload and restore
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends age
          python3 -m venv "$RUNNER_TEMP/s3"
          "$RUNNER_TEMP/s3/bin/pip" install -q "moto[server]==5.0.28"
          "$RUNNER_TEMP/s3/bin/moto_server" -p 9000 > "$RUNNER_TEMP/s3.log" 2>&1 &
          timeout 60 sh -c 'until curl -fsS -o /dev/null http://localhost:9000/; do sleep 1; done'
          export BACKUP_S3_ACCESS_KEY_ID=backup-ci BACKUP_S3_SECRET_ACCESS_KEY="$(openssl rand -hex 16)"
          export BACKUP_S3_ENDPOINT=http://localhost:9000 BACKUP_S3_REGION=us-east-1 BACKUP_S3_BUCKET=backups
          printf 'user = "%s:%s"\n' "$BACKUP_S3_ACCESS_KEY_ID" "$BACKUP_S3_SECRET_ACCESS_KEY" |
            curl -fsS -o /dev/null -K - --aws-sigv4 "aws:amz:us-east-1:s3" -X PUT http://localhost:9000/backups
          age-keygen -o "$RUNNER_TEMP/backup.key"
          export BACKUP_AGE_RECIPIENT="$(age-keygen -y "$RUNNER_TEMP/backup.key")"
          rm -f backups/lecturo-*
          infra/backup/backup.sh
          archive=$(ls backups/lecturo-*.tar.age)
          test -z "$(ls backups/lecturo-*.dump 2>/dev/null)"
          printf 'user = "%s:%s"\n' "$BACKUP_S3_ACCESS_KEY_ID" "$BACKUP_S3_SECRET_ACCESS_KEY" |
            curl -fsS -K - --aws-sigv4 "aws:amz:us-east-1:s3" -o "$RUNNER_TEMP/uploaded.tar.age" "http://localhost:9000/backups/daily/$(basename "$archive")"
          cmp "$archive" "$RUNNER_TEMP/uploaded.tar.age"
          age -d -i "$RUNNER_TEMP/backup.key" "$archive" | tar -tf - | grep -qx lecturo.dump
          rm -f backups/pre-restore-*
          for day in 01 02 03; do
            age -d -i "$RUNNER_TEMP/backup.key" "$archive" | tar -xOf - lecturo.dump > "backups/pre-restore-202601$day-000000.dump"
          done
          echo yes | BACKUP_AGE_IDENTITY="$RUNNER_TEMP/backup.key" infra/backup/restore.sh "$archive"
          test "$(ls backups/pre-restore-* | wc -l)" -eq 3
          ls backups/pre-restore-*.tar.age
          test ! -e backups/pre-restore-20260101-000000.dump
          echo yes | BACKUP_AGE_IDENTITY="$RUNNER_TEMP/backup.key" infra/backup/restore.sh backups/pre-restore-20260102-000000.dump
          test "$(ls backups/pre-restore-* | wc -l)" -eq 3
          curl -fsS http://localhost/api/v1/health
      - if: failure()
        run: docker compose logs
