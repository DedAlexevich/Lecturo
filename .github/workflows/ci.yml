name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lecturo
          POSTGRES_PASSWORD: lecturo
          POSTGRES_DB: lecturo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lecturo"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://lecturo:lecturo@localhost:5432/lecturo
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-inter fonts-dejavu-core
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python ../scripts/check_comments.py . ../scripts
      - run: test "$(alembic heads | wc -l)" -eq 1
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest
      - name: openapi.json up to date
        run: |
          python -m app.openapi openapi.json
          git diff --exit-code openapi.json

  bot:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lecturo
          POSTGRES_PASSWORD: lecturo
          POSTGRES_DB: lecturo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lecturo"
          --health-interval 5s
          --health-retries 10
    env:
      BOT_SCHEMA_CHECK: "1"
      PGHOST: localhost
      PGUSER: lecturo
      PGPASSWORD: lecturo
      PGDATABASE: lecturo
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bot/pyproject.toml
            backend/pyproject.toml
      - name: Apply backend migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://lecturo@localhost:5432/lecturo
        run: |
          python -m venv "$RUNNER_TEMP/backend"
          "$RUNNER_TEMP/backend/bin/pip" install -e .
          "$RUNNER_TEMP/backend/bin/alembic" upgrade head
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python ../scripts/check_comments.py . ../scripts
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:comments
      - run: npm run test:local
      - name: API types up to date
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run build
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Telegram Mini App tests
        env:
          VITE_TELEGRAM_BOT_USERNAME: lecturo_test_bot
        run: |
          npx vite --host 127.0.0.1 --port 5186 --strictPort &
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:5186/ >/dev/null; do sleep 1; done'
          npm run test:telegram

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 180 db redis api worker bot frontend tusd caddy db-backup
      - run: curl -fsS http://localhost/api/v1/health
      - run: curl -fsS http://localhost/ | grep -q Lecturo
      - name: Hooks endpoint closed from outside
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/api/v1/uploads/hooks)" = 404
      - name: tusd reaches hooks inside compose
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Tus-Resumable: 1.0.0' -H 'Upload-Length: 10' http://localhost/files/)" = 401
      - run: test "$(docker compose ps worker --format '{{.State}}')" = running
      - run: test "$(docker compose ps bot --format '{{.State}}')" = running
      - name: Scheduled backup exists and local scripts work
        run: |
          timeout 60 sh -c 'until ls data/backups/lecturo-*.dump; do sleep 1; done'
          scripts/backup-db.sh
          echo yes | scripts/restore-db.sh "$(ls data/backups/lecturo-*.dump | tail -n 1)"
          curl -fsS http://localhost/api/v1/health
      - name: Backup, check and restore database
        run: |
          infra/backup/backup.sh
          infra/backup/check.sh
          echo yes | infra/backup/restore.sh "$(ls backups/lecturo-*.dump)"
          curl -fsS http://localhost/api/v1/health
      - name: Encrypted backup, upload and restore
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends age
          export MINIO_ROOT_USER=backup-ci MINIO_ROOT_PASSWORD="$(openssl rand -hex 16)"
          export BACKUP_S3_ACCESS_KEY_ID="$MINIO_ROOT_USER" BACKUP_S3_SECRET_ACCESS_KEY="$MINIO_ROOT_PASSWORD"
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          timeout 60 sh -c 'until curl -fsS http://localhost:9000/minio/health/live; do sleep 1; done'
          export BACKUP_S3_ENDPOINT=http://localhost:9000 BACKUP_S3_REGION=us-east-1 BACKUP_S3_BUCKET=backups
          printf 'user = "%s:%s"\n' "$BACKUP_S3_ACCESS_KEY_ID" "$BACKUP_S3_SECRET_ACCESS_KEY" |
            curl -fsS -K - --aws-sigv4 "aws:amz:us-east-1:s3" -X PUT http://localhost:9000/backups
          age-keygen -o "$RUNNER_TEMP/backup.key"
          export BACKUP_AGE_RECIPIENT="$(age-keygen -y "$RUNNER_TEMP/backup.key")"
          rm -f backups/lecturo-*
          infra/backup/backup.sh
          archive=$(ls backups/lecturo-*.tar.age)
          test -z "$(ls backups/lecturo-*.dump 2>/dev/null)"
          printf 'user = "%s:%s"\n' "$BACKUP_S3_ACCESS_KEY_ID" "$BACKUP_S3_SECRET_ACCESS_KEY" |
            curl -fsS -K - --aws-sigv4 "aws:amz:us-east-1:s3" -o "$RUNNER_TEMP/uploaded.tar.age" "http://localhost:9000/backups/daily/$(basename "$archive")"
          cmp "$archive" "$RUNNER_TEMP/uploaded.tar.age"
          rm -f backups/pre-restore-*
          touch backups/pre-restore-20260101-000000.dump backups/pre-restore-20260102-000000.dump backups/pre-restore-20260103-000000.dump
          echo yes | BACKUP_AGE_IDENTITY="$RUNNER_TEMP/backup.key" infra/backup/restore.sh "$archive"
          test "$(ls backups/pre-restore-* | wc -l)" -eq 3
          ls backups/pre-restore-*.tar.age
          test ! -e backups/pre-restore-20260101-000000.dump
          curl -fsS http://localhost/api/v1/health
      - if: failure()
        run: docker compose logs
