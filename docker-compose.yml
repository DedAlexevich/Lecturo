services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lecturo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lecturo}
      POSTGRES_DB: lecturo
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecturo"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://lecturo:${POSTGRES_PASSWORD:-lecturo}@db:5432/lecturo
      REDIS_URL: redis://redis:6379/0
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build: ./backend
    command: arq app.worker.WorkerSettings
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://lecturo:${POSTGRES_PASSWORD:-lecturo}@db:5432/lecturo
      REDIS_URL: redis://redis:6379/0
    volumes:
      - storage:/data/storage
    depends_on:
      - api
    restart: unless-stopped

  tusd:
    image: tusproject/tusd:v2.6.0
    user: "0:0"
    command:
      - -upload-dir=/data/storage/uploads
      - -base-path=/files/
      - -behind-proxy
      - -max-size=2147483648
      - -hooks-http=http://api:8000/api/v1/uploads/hooks
      - -hooks-enabled-events=pre-create,post-finish
      - -hooks-http-forward-headers=Authorization
    volumes:
      - storage:/data/storage
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - storage:/srv/storage:ro
      - caddy_data:/data
    depends_on:
      - api
      - frontend
      - tusd
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  caddy_data:
